services:
  web_app:
    build: .
    container_name: radar-web
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - CALCULADORA_URL=http://host.docker.internal:8000/api/CalculaNota
    extra_hosts:
      - "host.docker.internal:host-gateway"
    sysctls:
      - net.ipv4.ip_local_port_range=1024 65535
      - net.ipv4.tcp_tw_reuse=1
    networks:
      - radar_network

  locust_tester:
    image: locustio/locust
    container_name: radar-locust
    ports:
      - "8089:8089"
    volumes:
      - ./locustfile.py:/mnt/locust/locustfile.py
    command: -f /mnt/locust/locustfile.py
    networks:
      - radar_network

networks:
  radar_network:
    driver: bridge